name: Aegis Guardian CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Standard security practice: Give the GITHUB_TOKEN minimal permissions
permissions:
  contents: read
  pull-requests: write # Needed for the labeler bot

jobs:
  aegis-core-pipeline:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Checkout Aegis Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # High-speed dependency caching

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🔍 Security Audit (npm)
        # Fails the build if any High or Critical vulnerabilities are found
        run: npm audit --audit-level=high

      - name: 🧹 Lint Check
        # Ensures clean code and catches "any" usage
        run: npm run lint

      - name: 🏗️ Production Build
        # Verifies that NestJS can actually compile
        run: npm run build

      - name: 📏 Build Size Report
        run: |
          echo "### Build Artifact Size" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY

      - name: 📁 Archive Build Artifact
        # Saves the compiled JS as a downloadable zip on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: aegis-production-bundle
          path: dist/
          retention-days: 7

  # 🤖 AUTOMATION BOTS JOB
  aegis-automation:
    name: Project Management Bots
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 🏷️ PR Size Labeler
        # Helps reviewers by labeling PRs as XS, S, M, L, XL
        uses: pascalgn/size-label-action@v0.5.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: '15'
          s_max_size: '100'
          m_max_size: '300'
          l_max_size: '800'
