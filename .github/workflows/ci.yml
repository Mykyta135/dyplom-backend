name: Aegis Guardian CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  aegis-core-pipeline:
    name: Build & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 🛡️ Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: 📦 Install Deps
        run: npm ci --ignore-scripts

      - name: 🔍 Security Audit (npm)
        run: npm audit --audit-level=high

      - name: 🧹 Lint Check
        run: npm run lint

      - name: 🏗️ Production Build
        run: npm run build

      - name: 🐳 Build Docker Image
        working-directory: .
        run: docker build -t aegis-api:${{ github.sha }} -f backend/Dockerfile ./backend

      - name: 🛡️ Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aegis-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: 📏 Build Size Report
        run: |
          echo "### Build Artifact Size" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY

      - name: 📁 Archive Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-production-bundle
          path: dist/
          retention-days: 7

  aegis-automation:
    name: Project Management Bots
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🏷️ PR Size Labeler
        uses: pascalgn/size-label-action@v0.5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
