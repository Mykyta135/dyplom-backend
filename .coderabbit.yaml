reviews:
  profile: 'assertive' # Senior Architect persona
  request_changes_workflow: true # AI will explicitly request changes on blockers
  high_level_summary: true # Provides a TL;DR for the lead dev
  path_filters:
    - '!**/*.md'
    - '!**/*.txt'
    - '!package-lock.json'
    - '!yarn.lock'
    - '!dist/**'
    - '!test/**'
  auto_review:
    enabled: true
    drafts: false # Do not review draft PRs
    base_branches:
      - '^main$'
      - '^dev$'
      - '^feature/.*'
      - '^release/.*'
      - '^hotfix/.*'
  # Move global guidance to tone_instructions (top-level) or path_instructions if needed.
chat:
  auto_reply: true
  art: true